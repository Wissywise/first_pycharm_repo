<!DOCTYPE html>
<html>
<head>
    <title>Live Earthquake Data</title>
    <style>
        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Live Earthquakes (Past Hour)</h2>
    <table>
        <tr>
            <th>Magnitude</th>
            <th>Location</th>
            <th>Time (ms)</th>
            <th>More Info</th>
        </tr>
        {% for record in records %}
        <tr>
            <td>{{ record.magnitude }}</td>
            <td>{{ record.place }}</td>
            <td>{{ record.time }}</td>
            <td><a href="{{ record.link }}" target="_blank">View</a></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
